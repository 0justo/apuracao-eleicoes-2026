<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="fav-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F87171" />
      <stop offset="35%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <linearGradient id="fav-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="35%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="emerald-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo Dark / True Black com cantos arredondados -->
  <rect width="64" height="64" rx="14" fill="#09090b" />
  <rect width="64" height="64" rx="14" fill="none" stroke="#27272a" stroke-width="1.5" />

  <!-- Linha de base da apuração -->
  <line x1="10" y1="52" x2="54" y2="52" stroke="#27272a" stroke-width="2" stroke-linecap="round" />

  <!-- Linha divisória neutra de 50% -->
  <line x1="32" y1="20" x2="32" y2="48" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="2 2" stroke-opacity="0.8" />

  <!-- Bloco / Barra Esquerda (Vermelho - Lula/PT) -->
  <rect x="13" y="20" width="16" height="28" rx="4" fill="url(#fav-red)" />

  <!-- Bloco / Barra Direita (Azul - Flávio Bolsonaro/PL) -->
  <rect x="35" y="16" width="16" height="32" rx="4" fill="url(#fav-blue)" />

  <!-- Ponto / Anel Central com Brilho Esmeralda (Transmissão Ao Vivo) -->
  <g filter="url(#emerald-glow)">
    <circle cx="32" cy="10" r="5.2" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.65" fill="none" />
    <circle cx="32" cy="10" r="2.8" fill="#10b981" />
    <circle cx="32" cy="10" r="1.1" fill="#ffffff" />
  </g>
</svg>